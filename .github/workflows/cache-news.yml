name: Cache Q-dance News

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 6am UTC
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch Q-dance YouTube RSS
        run: node scripts/cache-qdance-news.mjs
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/qdance-news.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update Q-dance news cache"
            for attempt in 1 2 3; do
              git pull --rebase origin master && git push && break
              echo "Push attempt $attempt failed, retrying..."
              [ $attempt -eq 3 ] && exit 1
            done
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
