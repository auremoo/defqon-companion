name: Cache Defqon Timetable

on:
  schedule:
    - cron: '0 7 * * *' # Every day at 7am UTC
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Poll Q-dance timetable API
        run: node scripts/cache-timetable.mjs
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/timetable-2026.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update official Defqon.1 2026 timetable"
            git pull --rebase origin master
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
