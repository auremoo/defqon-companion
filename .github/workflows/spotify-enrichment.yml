name: Spotify Enrichment

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 4am UTC
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enrich artists from Spotify
        run: node scripts/spotify-enrichment.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/spotify-enrichment.json
          git diff --staged --quiet || git commit -m "chore: update Spotify enrichment data"
          git push
